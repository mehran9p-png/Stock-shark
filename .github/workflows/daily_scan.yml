name: TSE Daily Multi-Factor Screener

on:
  schedule:
    # اجرا در روزهای شنبه تا چهارشنبه ساعت ۱۳:۰۰ به وقت ایران (۰۹:۳۰ به وقت UTC)
    # در استاندارد کرون: 0=یکشنبه، 1=دوشنبه، 2=سه‌شنبه، 3=چهارشنبه، 6=شنبه
    - cron: '30 9 * * 6,0,1,2,3'
  workflow_dispatch: # امکان اجرای دستی در هر لحظه از تب Actions گیت‌هاب

permissions:
  contents: write

jobs:
  scan-and-score:
    name: Run Multi-Factor Quant Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TSE Multi-Factor Screener
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Tehran
        run: |
          python scripts/screener.py

      - name: Commit and Push Updated Market Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          if git diff --staged --quiet; then
            echo "No changes in market_data.json to commit."
          else
            git commit -m "chore(data): auto-update TSE multi-factor scores [$(date +'%Y-%m-%d %H:%M')]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
